# Локальна БД:            docker compose up -d db
# Повне демо (VPS):        docker compose --profile app up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tir
      POSTGRES_PASSWORD: tir
      POSTGRES_DB: tir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tir"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tir:tir@db:5432/tir?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?задайте AUTH_SECRET у .env}
      AUTH_TRUST_HOST: "true"
      DEMO_MODE: ${DEMO_MODE:-true}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/storage/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage

volumes:
  pgdata:
  uploads:
